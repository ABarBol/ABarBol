name: Generar serpiente

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#fb5607&color_dots=#ebedf0,#ffd166,#ffb703,#fb8500,#d00000
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#fb5607&color_dots=#161b22,#ffd166,#ffb703,#fb8500,#d00000

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
